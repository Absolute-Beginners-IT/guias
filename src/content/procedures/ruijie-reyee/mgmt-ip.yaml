platform: ruijie-reyee
task: mgmt-ip
summary: >-
  Asigna una IP de gestión fija a un Ruijie NBS3200 desde su interfaz web, con su VLAN
  de gestión, máscara, puerta de enlace y DNS.
risk:
  level: high
  reason: >-
    Al guardar, la interfaz web pasa a la IP nueva y tu sesión se corta. Con datos o
    una VLAN de gestión equivocados el switch queda inalcanzable por red.
params:
  - id: vlanId
    label: VLAN de gestión
    type: vlan-id
    example: '1'
    help: Tiene que existir ya; si se deja vacía se usa la VLAN 1.
  - id: ipAddress
    label: IP de gestión
    type: ipv4
    example: 192.168.10.23
  - id: mask
    label: Máscara de red
    type: ipv4
    example: 255.255.255.0
  - id: gateway
    label: Puerta de enlace
    type: ipv4
    example: 192.168.10.1
  - id: dnsServer
    label: Servidor DNS
    type: ipv4
    example: 192.168.10.5
preflight:
  - text: Haz una copia de la configuración con la guía Guardar una copia de la configuración.
  - text: >-
      Comprueba que la VLAN {{vlanId}} existe en Local Device > VLAN > VLAN List y que
      llega por el puerto de subida (uplink) del switch. Si no, pierdes el acceso web.
  - text: Comprueba desde otro equipo que la IP {{ipAddress}} no responde a ping, para no duplicarla.
steps:
  - title: Abrir la página de la IP de gestión
    manual: true
    explanation: Ve a Local Device > Ports > MGMT IP > MGMT IP.
  - title: Pasar a IP fija y rellenar los datos
    manual: true
    explanation: >-
      Elige Static IP y completa VLAN de gestión {{vlanId}}, IP {{ipAddress}},
      máscara {{mask}}, puerta de enlace {{gateway}} y DNS {{dnsServer}}.
  - title: Guardar
    manual: true
    explanation: Pulsa Save. El switch pasa a la IP nueva y la sesión actual se corta.
    warning: Desde este momento el switch solo responde en {{ipAddress}}.
  - title: Entrar por la IP nueva
    manual: true
    explanation: Abre en el navegador http://{{ipAddress}} y vuelve a iniciar sesión.
verification:
  - expect: >-
      En Local Device > Home > Basic Info, la IP de gestión es {{ipAddress}}, y el
      switch responde a ping desde otra red, lo que confirma la puerta de enlace.
rollback:
  summary: >-
    Si puedes entrar por la IP nueva, vuelve a poner la anterior o DHCP. Si no puedes
    entrar, hay que llegar al switch desde la red de la IP nueva o volver a fábrica.
  steps:
    - title: Volver a la configuración anterior
      manual: true
      explanation: >-
        En Local Device > Ports > MGMT IP > MGMT IP, vuelve a poner los datos que tenía
        o elige DHCP, y pulsa Save.
    - title: Si no puedes entrar por la IP nueva
      manual: true
      explanation: >-
        Conecta un portátil a un puerto de la VLAN {{vlanId}} con una IP de la misma
        red que {{ipAddress}} y entra por http://{{ipAddress}} para corregir los datos.
  lockoutRecovery: >-
    Si no hay forma de llegar, mantén pulsado el botón Reset del panel más de 5
    segundos: el switch vuelve a fábrica (10.44.77.200, contraseña admin). Después
    importa la copia hecha antes de empezar.
sources:
  - title: Ruijie Reyee NBS3200 V2 — ReyeeOS 2.341 Configuration Guide, apartado MGMT IP Configuration
    url: https://reyee.ruijie.com/en-global/support/documents/slide_rg-nbs3200-24gt4xs-p-v2-nbs3200-48gt4xs-p-v2-switches-implementation-cookbook/
status:
  level: docs-checked
  reviewed: '2026-10-14'
  firmware: ReyeeOS 2.341
  notes: >-
    Pasos y campos contrastados con la guía oficial, incluido el aviso de asociar la
    VLAN de gestión al puerto de subida. Que la sesión se corta al guardar es lo
    esperado al cambiar la IP; la guía no lo dice de forma literal. Falta probarla
    en un NBS3200 real.
