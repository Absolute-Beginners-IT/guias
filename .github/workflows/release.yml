name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs; the comment names its release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi

      - name: Publish the offline HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="manual-switching-${GITHUB_REF_NAME}.html"
          cp dist/index.html "$asset"
          gh release create "$GITHUB_REF_NAME" "$asset" --title "Manual de Switching ${GITHUB_REF_NAME}" --generate-notes
